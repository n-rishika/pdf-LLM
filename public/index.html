<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Rule Checker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            margin: 20px;
        }
        h1 {
            text-align: center;
            color: #4a5568;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: bold;
            margin-bottom: 5px;
            color: #2d3748;
        }
        input[type="file"] {
            padding: 10px;
            border: 2px dashed #cbd5e0;
            border-radius: 5px;
            margin-bottom: 20px;
            background: #f7fafc;
            transition: border-color 0.3s;
        }
        input[type="file"]:hover {
            border-color: #667eea;
        }
        input[type="text"] {
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        #results {
            margin-top: 30px;
        }
        .result-card {
            background: #f8f9fa;
            border-left: 5px solid #667eea;
            padding: 20px;
            margin: 15px 0;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .result-card.pass {
            border-left-color: #48bb78;
        }
        .result-card.fail {
            border-left-color: #f56565;
        }
        .result-card h3 {
            margin-top: 0;
            color: #2d3748;
        }
        .result-card p {
            margin: 5px 0;
        }
        .status {
            font-weight: bold;
            text-transform: uppercase;
        }
        .status.pass {
            color: #48bb78;
        }
        .status.fail {
            color: #f56565;
        }
        .confidence {
            font-weight: bold;
            color: #667eea;
        }
        .loading {
            text-align: center;
            color: #667eea;
            font-size: 18px;
        }
        .error {
            background: #fed7d7;
            color: #c53030;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>PDF Rule Checker</h1>
        <form id="checkForm" enctype="multipart/form-data">
            <label for="pdf">Upload PDF:</label>
            <input type="file" id="pdf" name="pdf" accept=".pdf" required>
            <label>Rules:</label>
            <input type="text" name="rule1" placeholder="e.g., The document must have a purpose section." required>
            <input type="text" name="rule2" placeholder="e.g., The document must mention at least one date." required>
            <input type="text" name="rule3" placeholder="e.g., The document must define at least one term." required>
            <button type="submit">Check PDF</button>
        </form>
        <div id="results"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
